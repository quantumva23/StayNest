services:
  - type: web
    name: staynest-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: staynest-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: sandbox_mock
      - key: PAYMENT_KEY_ID
        value: rzp_test_placeholder_key
      - key: PAYMENT_KEY_SECRET
        value: rzp_test_placeholder_secret
      - key: PAYMENT_WEBHOOK_SECRET
        value: rzp_test_webhook_secret

databases:
  - name: staynest-db
    databaseName: staynest
    user: staynest
    plan: free
